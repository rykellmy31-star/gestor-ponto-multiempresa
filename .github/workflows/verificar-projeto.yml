
name: Verificar CR JORNADA

on:
  push:
    branches:
      - desenvolvimento-cr-jornada
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# Verificações automáticas restritas à branch de desenvolvimento.
# Nenhum deploy, operação remota D1 ou gravação em produção.
# O cancelamento de versões antigas evita duplicações no mesmo ref.
concurrency:
  group: cr-jornada-verificacao-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Compilacao e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verificar sequencia SQL e arquivos sensiveis no Git
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_verify_repository_guards.py' -v
          python3 -B scripts/verify_repository_guards.py

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=moderate

      - name: Validar gerador seguro de ambiente staging
        run: node --test scripts/test_prepare_cloudflare_staging.mjs

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar TypeScript dos testes
        run: npm run typecheck:tests

      - name: Testes de logica, rotas e autorizacao
        run: npx vitest run --exclude 'tests/d1-*.test.ts' --no-file-parallelism --maxWorkers=2

      - name: Compilar interface React
        run: npm run build:web

      - name: Verificar Cloudflare Worker
        run: npx wrangler deploy --dry-run --outdir .worker-bundle

      # Auditoria remota OPCIONAL de metadados via token Cloudflare read-only.
      # Nenhum deploy, SQL, migracao ou alteracao na conta remota.
      - name: Testar relatorio Cloudflare somente leitura (sem rede)
        run: node --test scripts/test_cloudflare_readonly.mjs

      - name: Inventario Cloudflare remoto (somente leitura, se autorizado)
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_AUDIT_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            node scripts/cloudflare-readonly.mjs
          else
            echo "Auditoria remota nao executada: credenciais de leitura ainda nao configuradas."
          fi

  d1-local:
    name: Integracao D1 local (parte ${{ matrix.shard }} de 3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Testar banco D1 exclusivamente local
        run: npx vitest run tests/d1- --shard=${{ matrix.shard }}/3 --no-file-parallelism --maxWorkers=1
