
name: Verificar CR JORNADA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Compilacao e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Executar testes automatizados
        run: npm test

      - name: Compilar interface React
        run: npm run build:web

      - name: Verificar Cloudflare Worker
        run: npx wrangler deploy --dry-run --outdir .worker-bundle
