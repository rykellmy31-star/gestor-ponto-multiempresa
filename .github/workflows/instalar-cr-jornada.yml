
name: Instalar CR JORNADA pelo ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Descompactar projeto
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          arquivo = Path("CR-JORNADA-versao-segura.zip")
          if not arquivo.is_file():
              raise SystemExit(
                  "ZIP nao encontrado na raiz do repositorio."
              )

          with ZipFile(arquivo) as zip_file:
              for item in zip_file.infolist():
                  caminho = PurePosixPath(item.filename)

                  if not caminho.parts:
                      continue

                  if caminho.parts[0] != "CR-JORNADA":
                      raise SystemExit(
                          "Estrutura inesperada no ZIP."
                      )

                  partes = caminho.parts[1:]
                  if not partes:
                      continue

                  if (
                      caminho.is_absolute()
                      or any(p in ("..", ".git") for p in partes)
                      or "\\" in item.filename
                  ):
                      raise SystemExit(
                          "Caminho inseguro no ZIP."
                      )

                  tipo = (item.external_attr >> 16) & 0o170000
                  if tipo == stat.S_IFLNK:
                      raise SystemExit(
                          "Links simbolicos nao permitidos."
                      )

                  destino = Path(*partes)

                  if item.is_dir():
                      destino.mkdir(parents=True, exist_ok=True)
                      continue

                  destino.parent.mkdir(
                      parents=True, exist_ok=True
                  )

                  with zip_file.open(item) as origem:
                      with destino.open("wb") as saida:
                          while bloco := origem.read(1024 * 1024):
                              saida.write(bloco)

          arquivo.unlink()
          print("Arquivos instalados com sucesso.")
          PY

      - name: Salvar alteracoes no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
          else
            git commit -m "Instalar versao segura CR JORNADA"
            git push
          fi
