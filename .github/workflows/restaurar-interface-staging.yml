name: Publicar restauracao visual CR JORNADA no staging

on:
  push:
    branches:
      - restaurar-interface-original-pagpouco
    paths:
      - 'web/src/**'
      - 'server/routes/**'
      - '.github/workflows/restaurar-interface-staging.yml'
      - 'scripts/provision-cloudflare-staging.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cr-jornada-staging
  cancel-in-progress: false

jobs:
  verificar:
    name: Validar nova interface e isolamento antes do deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar destinos e historico SQL
        run: |
          python3 -B scripts/verify_repository_guards.py
          node --test scripts/test_staging_guard.mjs scripts/test_provision_cloudflare_staging.mjs
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos e testes
        run: |
          npm run typecheck
          npm run typecheck:tests
          npx vitest run tests/company-routing.test.ts tests/company-auth.test.ts tests/d1-company-attendance.test.ts tests/employee-cpf-punch-route.test.ts --maxWorkers=1 --no-file-parallelism
          npm run build:web
      - name: Dry-run do Worker
        run: npx wrangler deploy --dry-run --outdir .worker-staging-check

  publicar:
    name: Publicar somente no Worker staging preexistente
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias e compilar
        run: |
          npm ci
          npm run typecheck
          npm run build:web
      - name: Confirmar D1 e Worker separados antes da publicacao
        env:
          CLOUDFLARE_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_STAGING_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Token ou Account ID de staging ausente"
            exit 1
          fi
          node --input-type=module -e "import {provisionStaging} from './scripts/provision-cloudflare-staging.mjs'; await provisionStaging({exerciseFeatures:true});"
      - name: Validar URL HTTPS de staging
        run: |
          curl --fail --silent --show-error --max-time 25 https://gestor-ponto-multiempresa-staging.netssh3-0.workers.dev/api/health > /tmp/cr-staging-health.json
          node --input-type=module -e "import{readFileSync}from'node:fs';const x=JSON.parse(readFileSync('/tmp/cr-staging-health.json','utf8'));if(x.status!=='ok'||x.database!=='D1')process.exit(1);console.log('Staging D1 responde a health.');"
          curl --fail --silent --show-error --max-time 25 -o /dev/null https://gestor-ponto-multiempresa-staging.netssh3-0.workers.dev/funcionario
          curl --fail --silent --show-error --max-time 25 -o /dev/null https://gestor-ponto-multiempresa-staging.netssh3-0.workers.dev/empresa
      - name: Resumo
        run: |
          echo 'Nova interface publicada exclusivamente no staging, sem alterar banco ou Worker de producao.' >> "$GITHUB_STEP_SUMMARY"
          echo 'URL: https://gestor-ponto-multiempresa-staging.netssh3-0.workers.dev/' >> "$GITHUB_STEP_SUMMARY"
