name: Acesso proprietario somente staging
on:
  push:
    branches: [desenvolvimento-cr-jornada]
    paths: ['staging-owner-request.json']
permissions:
  contents: read
concurrency:
  group: cr-jornada-staging
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar protecoes, tipos e fluxo de primeiro acesso
        run: |
          python3 -B scripts/verify_repository_guards.py
          npm run typecheck
          npx vitest run tests/d1-platform-owner-access.test.ts --maxWorkers=1 --no-file-parallelism
          npm run build:web
      - name: Provisionar acesso somente no staging autorizado
        env:
          CLOUDFLARE_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-owner-access-staging.mjs
